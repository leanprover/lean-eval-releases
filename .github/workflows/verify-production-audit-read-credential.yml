name: Verify production audit read credential

on:
  workflow_dispatch:
    inputs:
      confirm_publication_disabled:
        description: Confirm this read-only preflight must not publish or write State
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: lean-eval-release-controller-production-audit-read-preflight
  cancel-in-progress: false

jobs:
  authorize:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require an exact protected publication-disabled dispatch
        env:
          CONFIRM_PUBLICATION_DISABLED: ${{ inputs.confirm_publication_disabled }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REPOSITORY" = leanprover/lean-eval-releases
          test "$DISPATCH_REF" = refs/heads/main
          test "$CONFIRM_PUBLICATION_DISABLED" = true

  audit-read:
    needs: authorize
    if: >-
      github.repository == 'leanprover/lean-eval-releases' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_publication_disabled == true
    permissions:
      contents: read
    environment: release-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the publication latch to remain off
        env:
          PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED }}
        run: |
          set -euo pipefail
          case "$PUBLICATION_ENABLED" in
            ""|false) ;;
            *) echo "PUBLICATION_ENABLED must remain absent or false" >&2; exit 1 ;;
          esac

      # This is the job's only secret. Non-cone sparse checkout with a path that
      # cannot exist in the repository authenticates Git upload-pack while the
      # blob:none filter leaves every private audit blob unmaterialized.
      # The proof is deliberately the final job step; the pinned action removes
      # its persisted key during the immediately following post-job cleanup.
      - name: Authenticate to audit without materializing the private corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-audit
          ref: main
          path: audit-proof
          fetch-depth: 1
          persist-credentials: true
          ssh-key: ${{ secrets.AUDIT_READ_KEY }}
          filter: blob:none
          sparse-checkout: |
            /.audit-read-proof
          sparse-checkout-cone-mode: false

      - name: Prove stable read access and denied receive-pack access
        run: |
          set -euo pipefail
          test "$(git -C audit-proof remote get-url origin)" = \
            git@github.com:leanprover/lean-eval-audit.git
          test "$(git -C audit-proof config remote.origin.partialclonefilter)" = \
            blob:none
          test "$(git -C audit-proof sparse-checkout list)" = /.audit-read-proof
          test ! -e audit-proof/archives
          test ! -e audit-proof/audit
          test -z "$(find audit-proof -mindepth 1 -maxdepth 1 \
            ! -name .git -print -quit)"
          object_types=$(GIT_NO_LAZY_FETCH=1 git -C audit-proof cat-file \
            --batch-all-objects --batch-check='%(objecttype)')
          grep -Fxq commit <<<"$object_types"
          grep -Fxq tree <<<"$object_types"
          if grep -Fxq blob <<<"$object_types"; then
            echo "the audit checkout downloaded a private blob" >&2
            exit 1
          fi

          read_main() {
            git -C audit-proof ls-remote --exit-code origin refs/heads/main |
              awk 'NR == 1 { print $1 } END { if (NR != 1) exit 1 }'
          }

          audit_head=$(git -C audit-proof rev-parse HEAD)
          before=$(read_main)
          if [ "$audit_head" != "$before" ]; then
            echo "audit checkout is not the exact remote main ref" >&2
            exit 1
          fi

          set +e
          push_output=$(git -C audit-proof push --dry-run --porcelain origin \
            "$audit_head:refs/heads/main" 2>&1)
          push_status=$?
          set -e
          if [ "$push_status" -eq 0 ]; then
            echo "AUDIT_READ_KEY unexpectedly reached Git receive-pack" >&2
            exit 1
          fi
          case "$push_output" in
            *"The key you are authenticating with has been marked as read only."*) ;;
            *"ERROR: Permission to leanprover/lean-eval-audit.git denied to "*) ;;
            *"Write access to repository not granted."*) ;;
            *)
              echo "receive-pack probe failed for an unexpected reason" >&2
              printf '%s\n' "$push_output" >&2
              exit 1
              ;;
          esac

          after=$(read_main)
          if [ "$before" != "$after" ]; then
            echo "audit main changed during the receive-pack probe" >&2
            exit 1
          fi
          test -z "$(git -C audit-proof status --porcelain --untracked-files=all)"
          {
            echo '### Production audit read credential preflight passed'
            echo
            echo "- release controller source: \`$GITHUB_SHA\`"
            echo '- audit main remained identical throughout the probe'
            echo '- upload-pack succeeded before and after an explicit GitHub permission denial from receive-pack'
            echo '- no private audit blob was downloaded or materialized'
            echo '- publication remained disabled; no ref, State, release, AWS, or artifact write occurred'
          } >> "$GITHUB_STEP_SUMMARY"
