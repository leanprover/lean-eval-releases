name: Prove one credentialed staging release unwrap

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Accepted staging submission UUIDv7
        required: true
        type: string
      confirm_staging_smoke:
        description: Confirm a private staging archive may be decrypted and immediately discarded
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: lean-eval-release-controller-staging-smoke
  cancel-in-progress: false

jobs:
  unwrap-one:
    if: >-
      github.repository == 'leanprover/lean-eval-releases' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_staging_smoke == true
    environment: release-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-state-staging
          ref: main
          path: state
          fetch-depth: 0
          persist-credentials: false
          ssh-key: ${{ secrets.STAGING_STATE_READ_KEY }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      - name: Verify reviewed staging State code before executing it
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/verify_release_state_contract.py \
            --environment staging \
            --state-root state

      - name: Validate State and select the exact scheduled result
        id: plan
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -euo pipefail
          test "$(jq -r .environment state/state.json)" = staging
          python state/scripts/state.py --root state validate
          python state/scripts/state.py --root state materialize \
            --output "$RUNNER_TEMP/state-views"
          python scripts/release_controller.py staging-smoke-plan \
            --queue "$RUNNER_TEMP/state-views/release-queue.json" \
            --submission-id "$SUBMISSION_ID" \
            --output "$RUNNER_TEMP/release-plan.json"
          echo "archive_commit=$(jq -r .request.archive.archive_commit "$RUNNER_TEMP/release-plan.json")" \
            >> "$GITHUB_OUTPUT"

      - name: Check out the exact immutable audit commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-audit
          ref: ${{ steps.plan.outputs.archive_commit }}
          path: audit
          fetch-depth: 1
          persist-credentials: false
          ssh-key: ${{ secrets.AUDIT_READ_KEY }}

      - name: Read and bind the exact encrypted object
        run: |
          set -euo pipefail
          archive_commit=$(jq -r .request.archive.archive_commit "$RUNNER_TEMP/release-plan.json")
          archive_path=$(jq -r .request.archive.archive_path "$RUNNER_TEMP/release-plan.json")
          test "$(git -C audit rev-parse HEAD)" = "$archive_commit"
          test -f "audit/$archive_path"
          sidecar_path="${archive_path%.tar.age}.json"
          test -f "audit/$sidecar_path"
          cp "audit/$archive_path" "$RUNNER_TEMP/archive.tar.age"
          cp "audit/$sidecar_path" "$RUNNER_TEMP/archive-sidecar.json"
          rm -rf audit
          python scripts/release_controller.py prepare-unwrap \
            --plan "$RUNNER_TEMP/release-plan.json" \
            --sidecar "$RUNNER_TEMP/archive-sidecar.json" \
            --ciphertext "$RUNNER_TEMP/archive.tar.age" \
            --trusted-now "$(date --utc +%Y-%m-%dT%H:%M:%S.000Z)" \
            --output "$RUNNER_TEMP/unwrap-request.json"

      - name: Install checksum-pinned age 1.3.1
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --max-filesize 16777216 \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/age.tar.gz"
          printf '%s  %s\n' \
            bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377 \
            "$RUNNER_TEMP/age.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/age.tar.gz" --directory "$RUNNER_TEMP"
          install -m 0555 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age-bin"
          test "$("$RUNNER_TEMP/age-bin" --version)" = v1.3.1
          rm -rf "$RUNNER_TEMP/age" "$RUNNER_TEMP/age.tar.gz"

      - name: Require the exact staging release Invoke role
        env:
          CONFIGURED_ROLE_ARN: ${{ vars.AWS_RELEASE_UNWRAP_ROLE_ARN }}
        run: |
          set -euo pipefail
          test "$CONFIGURED_ROLE_ARN" = \
            arn:aws:iam::161072922960:role/lean-eval-release-unwrap-invoker-staging

      - name: Assume only the staging release Invoke role
        id: aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_UNWRAP_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: lean-eval-release-staging-smoke
          retry-max-attempts: 4
          allowed-account-ids: 161072922960
          output-credentials: false
          output-env-credentials: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"lambda:InvokeFunction","Resource":"arn:aws:lambda:us-east-1:161072922960:function:lean-eval-archive-unwrap-staging:live"},{"Effect":"Allow","Action":"sts:GetCallerIdentity","Resource":"*"}]}
          mask-aws-account-id: true

      - name: Consume one capability, drop authority, and verify plaintext
        if: always()
        env:
          AWS_STEP_OUTCOME: ${{ steps.aws.outcome }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -euo pipefail
          clear_oidc() {
            unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
            {
              echo 'ACTIONS_ID_TOKEN_REQUEST_TOKEN='
              echo 'ACTIONS_ID_TOKEN_REQUEST_URL='
            } >> "$GITHUB_ENV"
          }

          clear_authority() {
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            clear_oidc
            {
              echo 'AWS_ACCESS_KEY_ID='
              echo 'AWS_SECRET_ACCESS_KEY='
              echo 'AWS_SESSION_TOKEN='
            } >> "$GITHUB_ENV"
          }

          cleanup() {
            local status=$?
            trap - EXIT
            set +e
            clear_authority
            rm -rf "$RUNNER_TEMP/state-views"
            rm -f "$RUNNER_TEMP/identity.age" "$RUNNER_TEMP/source.tar.gz" \
              "$RUNNER_TEMP/unwrap-response.json" "$RUNNER_TEMP/unwrap-metadata.json" \
              "$RUNNER_TEMP/unwrap-request.json" "$RUNNER_TEMP/release-plan.json" \
              "$RUNNER_TEMP/archive.tar.age" "$RUNNER_TEMP/archive-sidecar.json" \
              "$RUNNER_TEMP/age-bin"
            exit "$status"
          }
          trap cleanup EXIT

          # GitHub injects a fresh OIDC request handle into every step in an
          # id-token job. No repository-authored step follows this one, and the
          # handle is discarded before any checked-out program executes.
          clear_oidc
          if [ "$AWS_STEP_OUTCOME" != success ]; then
            echo "staging release role assumption did not succeed" >&2
            exit 1
          fi

          aws lambda invoke \
            --function-name lean-eval-archive-unwrap-staging \
            --qualifier live \
            --cli-binary-format raw-in-base64-out \
            --payload "fileb://$RUNNER_TEMP/unwrap-request.json" \
            "$RUNNER_TEMP/unwrap-response.json" > "$RUNNER_TEMP/unwrap-metadata.json"
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN \
            python scripts/release_controller.py unwrap-identity \
              --request "$RUNNER_TEMP/unwrap-request.json" \
              --response "$RUNNER_TEMP/unwrap-response.json" \
              --metadata "$RUNNER_TEMP/unwrap-metadata.json" \
              --output "$RUNNER_TEMP/identity.age"
          clear_authority
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          "$RUNNER_TEMP/age-bin" --decrypt --identity "$RUNNER_TEMP/identity.age" \
            --output "$RUNNER_TEMP/source.tar.gz" "$RUNNER_TEMP/archive.tar.age"
          expected_plaintext=$(jq -r .sha256_plaintext_tar "$RUNNER_TEMP/archive-sidecar.json")
          actual_plaintext=$(sha256sum "$RUNNER_TEMP/source.tar.gz" | awk '{print $1}')
          test "$actual_plaintext" = "$expected_plaintext"
          PYTHONPATH=scripts python -c \
            'import pathlib; from reconstruct_release import _read_release_sources; _read_release_sources(pathlib.Path("'"$RUNNER_TEMP"'/source.tar.gz"))'
          ciphertext_digest=$(jq -r .sha256_ciphertext "$RUNNER_TEMP/archive-sidecar.json")
          {
            echo '### Credentialed staging release boundary passed'
            echo
            echo "- submission: \`$SUBMISSION_ID\`"
            echo "- audit commit: \`${{ steps.plan.outputs.archive_commit }}\`"
            echo "- ciphertext SHA-256: \`$ciphertext_digest\`"
            echo '- plaintext matched the private sidecar and was discarded without publication or artifact upload'
          } >> "$GITHUB_STEP_SUMMARY"
