name: Verify production release controller credentials

on:
  workflow_dispatch:
    inputs:
      confirm_publication_disabled:
        description: Confirm this preflight must not publish or write State
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lean-eval-release-controller-production
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_publication_disabled == true
    environment: release-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the publication latch to remain off
        env:
          PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED }}
        run: |
          set -euo pipefail
          case "$PUBLICATION_ENABLED" in
            ""|false) ;;
            *) echo "PUBLICATION_ENABLED must remain absent or false" >&2; exit 1 ;;
          esac

      # This key is scoped only to the public release repository. Persisting it
      # is required solely for the receive-pack dry run below; no push occurs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
          ssh-key: ${{ secrets.RELEASE_PUBLISH_KEY }}

      # The separate controller key is scoped only to private production State.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-state
          ref: main
          path: state
          fetch-depth: 1
          persist-credentials: true
          ssh-key: ${{ secrets.PRODUCTION_STATE_CONTROLLER_KEY }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      - name: Validate the exact live production State checkout
        run: |
          set -euo pipefail
          test "$(jq -r .environment state/state.json)" = production
          python state/scripts/state.py --root state validate
          python state/scripts/state.py --root state materialize \
            --output "$RUNNER_TEMP/state-views"
          git -C state diff --exit-code
          test -z "$(git -C state status --porcelain --untracked-files=all)"

      - name: Prove both keys reach receive-pack without changing either ref
        run: |
          set -euo pipefail
          verify_noop_receive_pack() {
            local repository=$1
            local label=$2
            local local_head remote_head output
            local_head=$(git -C "$repository" rev-parse HEAD)
            remote_head=$(git -C "$repository" ls-remote --exit-code \
              origin refs/heads/main | awk '{print $1}')
            if [ "$local_head" != "$remote_head" ]; then
              echo "$label checkout is not the exact remote main ref" >&2
              exit 1
            fi
            output=$(git -C "$repository" push --dry-run --porcelain origin \
              "$local_head:refs/heads/main")
            if ! grep -F $'=\t'"$local_head"$':refs/heads/main\t[up to date]' \
              <<<"$output"; then
              echo "$label receive-pack dry run was not an exact no-op" >&2
              exit 1
            fi
          }

          verify_noop_receive_pack . release
          verify_noop_receive_pack state production-state
          test -z "$(git status --porcelain --untracked-files=all -- \
            . ':(exclude)state')"
          test -z "$(git -C state status --porcelain --untracked-files=all)"

      - name: Record source-free preflight evidence
        run: |
          {
            echo '### Production release controller credential preflight passed'
            echo
            echo "- release main: \`$(git rev-parse HEAD)\`"
            echo "- production State main: \`$(git -C state rev-parse HEAD)\`"
            echo '- both matching deploy keys authenticated to Git receive-pack'
            echo '- both receive-pack operations were exact-ref dry runs'
            echo '- production State validated and materialized outside its checkout'
            echo '- publication remained disabled; no ref, State, release, AWS, or artifact write occurred'
          } >> "$GITHUB_STEP_SUMMARY"
