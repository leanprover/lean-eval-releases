name: Publish due source release

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: Confirm one due production release may be published
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lean-eval-release-controller-production
  cancel-in-progress: false

jobs:
  prepare-one:
    if: >-
      github.repository == 'leanprover/lean-eval-releases' &&
      github.ref == 'refs/heads/main' &&
      vars.PUBLICATION_ENABLED == 'true' &&
      (github.event_name == 'schedule' || inputs.confirm_publication == true)
    environment: release-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      archive_commit: ${{ steps.started.outputs.archive_commit }}
      kind: ${{ steps.plan.outputs.kind }}
      plan_base64: ${{ steps.started.outputs.plan_base64 }}
      recorded: ${{ steps.started.outputs.recorded }}
      state_commit: ${{ steps.started.outputs.state_commit }}
      started_event_base64: ${{ steps.started.outputs.started_event_base64 }}
    steps:
      # actions/checkout pinned to v7.0.1. Preparation receives no OIDC, and
      # this checkout deliberately retains no repository credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # The separate deploy key reaches only private production State.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-state
          ref: main
          path: state
          fetch-depth: 0
          persist-credentials: true
          ssh-key: ${{ secrets.PRODUCTION_STATE_CONTROLLER_KEY }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      - name: Verify reviewed State code before executing it
        run: >-
          python scripts/verify_release_state_contract.py
          --environment production
          --state-root state

      - name: Validate controller and materialize exact production State
        env:
          PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED }}
        run: |
          set -euo pipefail
          test "$(jq -r .environment state/state.json)" = production
          python -m unittest discover -s tests -v
          python state/scripts/state.py --root state validate
          python state/scripts/state.py --root state materialize \
            --output "$RUNNER_TEMP/state-views"
          python scripts/release_qualification.py \
            --contract configuration/release-controller-credential-contract-v1.json \
            --release-root . \
            --state-root state \
            --queue "$RUNNER_TEMP/state-views/release-queue.json" \
            --acceptance-snapshot \
              "$RUNNER_TEMP/state-views/release-acceptance-snapshot.json" \
            --environment production \
            --publication-enabled "$PUBLICATION_ENABLED" \
            --mode publication \
            --output "$RUNNER_TEMP/release-controller-qualification.json"

      - name: Classify an interrupted release before selecting new work
        id: recovery
        run: |
          set -euo pipefail
          python scripts/release_controller.py recover \
            --domain "$RUNNER_TEMP/state-views/domain.json" \
            --release-root . \
            --trusted-now "$(date --utc +%Y-%m-%dT%H:%M:%S.000Z)" \
            --output "$RUNNER_TEMP/release-recovery.json"
          kind=$(jq -er .kind "$RUNNER_TEMP/release-recovery.json")
          case "$kind" in none|busy|failed|published) ;; *) exit 1 ;; esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Reconcile an interrupted release into State
        if: steps.recovery.outputs.kind == 'failed' || steps.recovery.outputs.kind == 'published'
        env:
          RECOVERY_KIND: ${{ steps.recovery.outputs.kind }}
        run: |
          set -euo pipefail
          jq .started_event "$RUNNER_TEMP/release-recovery.json" \
            > "$RUNNER_TEMP/release-started-event.json"
          if [ "$RECOVERY_KIND" = published ]; then
            release_path=$(jq -r .release_path "$RUNNER_TEMP/release-recovery.json")
            submission_id=$(jq -er .submission_id "$RUNNER_TEMP/release-recovery.json")
            tree_digest=$(jq -r .tree_digest "$RUNNER_TEMP/release-recovery.json")
            python scripts/classify_release_publication.py \
              --release-root . \
              --release-path "$release_path" \
              --submission-id "$submission_id" \
              --history-only \
              --output "$RUNNER_TEMP/recovered-publication-classification.json"
            test "$(jq -er .kind "$RUNNER_TEMP/recovered-publication-classification.json")" = existing
            repository_commit=$(jq -er .repository_commit \
              "$RUNNER_TEMP/recovered-publication-classification.json")
            git show "$repository_commit:release-manifest.json" \
              > "$RUNNER_TEMP/recovered-manifest.json"
            generated_at=$(jq -r .generated_at "$RUNNER_TEMP/recovered-manifest.json")
            python scripts/validate_manifest.py "$RUNNER_TEMP/recovered-manifest.json" \
              --trusted-as-of "$generated_at" \
              --state-acceptance-snapshot \
                "$RUNNER_TEMP/state-views/release-acceptance-snapshot.json" \
              --bundle-root .
            test "$(jq -r --arg path "$release_path" \
              '.entries[] | select(.release_path == $path) | .release_tree_sha256' \
              "$RUNNER_TEMP/recovered-manifest.json")" = "$tree_digest"
            python scripts/release_controller.py state-event published \
              --started-event "$RUNNER_TEMP/release-started-event.json" \
              --trusted-now "$(date --utc +%Y-%m-%dT%H:%M:%S.000Z)" \
              --repository-commit "$repository_commit" \
              --tree-digest "$tree_digest" \
              --release-path "$release_path" \
              --output "$RUNNER_TEMP/release-recovered-event.json"
          else
            python scripts/release_controller.py state-event failed \
              --started-event "$RUNNER_TEMP/release-started-event.json" \
              --trusted-now "$(date --utc +%Y-%m-%dT%H:%M:%S.000Z)" \
              --reason-code controller_interrupted \
              --retryable true \
              --output "$RUNNER_TEMP/release-recovered-event.json"
          fi
          state_head=$(git -C state rev-parse HEAD)
          python scripts/release_controller.py stage-state-transition \
            --state-root state \
            --event "$RUNNER_TEMP/release-recovered-event.json" \
            --protected-state-head "$state_head" \
            --output "$RUNNER_TEMP/release-recovered-transition.json"
          event_id=$(jq -er .event_id "$RUNNER_TEMP/release-recovered-event.json")
          event_path=$(jq -er .event_path "$RUNNER_TEMP/release-recovered-transition.json")
          status_path=$(jq -er .status_path "$RUNNER_TEMP/release-recovered-transition.json")
          test -f "state/$event_path"
          test -f "state/$status_path"
          git -C state config user.name lean-eval-release-controller
          git -C state config user.email lean-eval-release-controller@users.noreply.github.com
          python state/scripts/state.py --root state \
            --protected-main-commit "$state_head" validate
          python scripts/release_controller.py verify-staged-state-transition \
            --state-root state \
            --event "$RUNNER_TEMP/release-recovered-event.json" \
            --plan "$RUNNER_TEMP/release-recovered-transition.json"
          git -C state commit -m "Recover interrupted release $event_id"
          test "$(git -C state rev-parse HEAD^)" = "$state_head"
          git -C state push origin HEAD:main

      - name: Plan at the trusted workflow clock
        if: steps.recovery.outputs.kind == 'none'
        id: plan
        run: |
          set -euo pipefail
          trusted_now=$(date --utc +%Y-%m-%dT%H:%M:%S.000Z)
          python scripts/release_orchestrator.py \
            "$RUNNER_TEMP/state-views/release-queue.json" \
            --trusted-as-of "$trusted_now" \
            --controller-qualification \
              "$RUNNER_TEMP/release-controller-qualification.json" \
            --require-controller-qualification \
            --output "$RUNNER_TEMP/release-plan.json"
          kind=$(jq -r .kind "$RUNNER_TEMP/release-plan.json")
          case "$kind" in
            execution|empty|not_due) ;;
            *) echo "release planner returned an unknown kind" >&2; exit 1 ;;
          esac
          archive_commit=
          if [ "$kind" = execution ]; then
            test "$(jq -r .request.controller.mode \
              "$RUNNER_TEMP/release-plan.json")" = publication
            test "$(jq -r .request.controller.environment \
              "$RUNNER_TEMP/release-plan.json")" = production
            archive_commit=$(jq -er .request.archive.archive_commit \
              "$RUNNER_TEMP/release-plan.json")
            [[ "$archive_commit" =~ ^[0-9a-f]{40}$ ]]
          fi
          {
            echo "kind=$kind"
            echo "trusted_now=$trusted_now"
            if [ "$kind" = execution ]; then
              echo "archive_commit=$archive_commit"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Append release.started with compare-and-swap push
        if: steps.plan.outputs.kind == 'execution'
        id: started
        env:
          TRUSTED_NOW: ${{ steps.plan.outputs.trusted_now }}
        run: |
          set -euo pipefail
          python scripts/release_controller.py state-event started \
            --plan "$RUNNER_TEMP/release-plan.json" \
            --trusted-now "$TRUSTED_NOW" \
            --output "$RUNNER_TEMP/release-started-event.json"
          state_head=$(git -C state rev-parse HEAD)
          python scripts/release_controller.py stage-state-transition \
            --state-root state \
            --event "$RUNNER_TEMP/release-started-event.json" \
            --protected-state-head "$state_head" \
            --output "$RUNNER_TEMP/release-started-transition.json"
          event_id=$(jq -er .event_id "$RUNNER_TEMP/release-started-event.json")
          git -C state config user.name lean-eval-release-controller
          git -C state config user.email lean-eval-release-controller@users.noreply.github.com
          event_path=$(jq -er .event_path "$RUNNER_TEMP/release-started-transition.json")
          status_path=$(jq -er .status_path "$RUNNER_TEMP/release-started-transition.json")
          test -f "state/$event_path"
          test -f "state/$status_path"
          python state/scripts/state.py --root state \
            --protected-main-commit "$state_head" validate
          python scripts/release_controller.py verify-staged-state-transition \
            --state-root state \
            --event "$RUNNER_TEMP/release-started-event.json" \
            --plan "$RUNNER_TEMP/release-started-transition.json"
          git -C state commit -m "Start release $event_id"
          test "$(git -C state rev-parse HEAD^)" = "$state_head"
          git -C state push origin HEAD:main
          state_commit=$(git -C state rev-parse HEAD)
          [[ "$state_commit" =~ ^[0-9a-f]{40}$ ]]
          archive_commit=$(jq -er .request.archive.archive_commit \
            "$RUNNER_TEMP/release-plan.json")
          [[ "$archive_commit" =~ ^[0-9a-f]{40}$ ]]
          plan_base64=$(base64 --wrap=0 "$RUNNER_TEMP/release-plan.json")
          started_event_base64=$(base64 --wrap=0 \
            "$RUNNER_TEMP/release-started-event.json")
          test -n "$plan_base64"
          test -n "$started_event_base64"
          printf '%s\n' \
            "archive_commit=$archive_commit" \
            "plan_base64=$plan_base64" \
            "state_commit=$state_commit" \
            "started_event_base64=$started_event_base64" \
            "recorded=true" >> "$GITHUB_OUTPUT"


  unwrap-publish:
    needs: prepare-one
    if: >-
      needs.prepare-one.outputs.kind == 'execution' &&
      needs.prepare-one.outputs.archive_commit != '' &&
      needs.prepare-one.outputs.plan_base64 != '' &&
      needs.prepare-one.outputs.state_commit != '' &&
      needs.prepare-one.outputs.recorded == 'true'
    permissions:
      contents: read
      id-token: write
    environment: release-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          ssh-key: ${{ secrets.RELEASE_PUBLISH_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-state
          ref: main
          path: state
          fetch-depth: 0
          persist-credentials: true
          ssh-key: ${{ secrets.PRODUCTION_STATE_CONTROLLER_KEY }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-audit
          ref: ${{ needs.prepare-one.outputs.archive_commit }}
          path: audit
          fetch-depth: 1
          persist-credentials: false
          ssh-key: ${{ secrets.AUDIT_READ_KEY }}

      # This step uses only runner tools and literal workflow code. It copies
      # encrypted inputs but does not execute anything from a checkout.
      - name: Stage exact encrypted inputs without executing checked-out code
        env:
          PLAN_BASE64: ${{ needs.prepare-one.outputs.plan_base64 }}
          STATE_COMMIT: ${{ needs.prepare-one.outputs.state_commit }}
          STARTED_EVENT_BASE64: ${{ needs.prepare-one.outputs.started_event_base64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$PLAN_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release-plan.json"
          printf '%s' "$STARTED_EVENT_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release-started-event.json"
          test "$(git rev-parse HEAD)" = \
            "$(jq -er .request.controller.release_commit \
              "$RUNNER_TEMP/release-plan.json")"
          test "$(git -C state rev-parse HEAD)" = "$STATE_COMMIT"
          archive_repository=$(jq -er .request.archive.archive_repository \
            "$RUNNER_TEMP/release-plan.json")
          archive_commit=$(jq -er .request.archive.archive_commit \
            "$RUNNER_TEMP/release-plan.json")
          archive_path=$(jq -er .request.archive.archive_path \
            "$RUNNER_TEMP/release-plan.json")
          test "$archive_repository" = leanprover/lean-eval-audit
          test "$(git -C audit rev-parse HEAD)" = "$archive_commit"
          test -f "audit/$archive_path"
          sidecar_path="${archive_path%.tar.age}.json"
          test -f "audit/$sidecar_path"
          cp "audit/$archive_path" "$RUNNER_TEMP/archive.tar.age"
          cp "audit/$sidecar_path" "$RUNNER_TEMP/archive-sidecar.json"
          test -z "$(git -C audit config --local --get core.sshCommand || :)"
          release_ssh=$(git config --local --get core.sshCommand)
          state_ssh=$(git -C state config --local --get core.sshCommand)
          python -I - "$RUNNER_TEMP" "$release_ssh" "$state_ssh" <<'PY'
          import pathlib
          import re
          import shlex
          import stat
          import sys

          runner_temp = pathlib.Path(sys.argv[1]).resolve(strict=True)
          expected = set()
          for command in sys.argv[2:]:
              fields = shlex.split(command)
              if fields.count("-i") != 1:
                  raise SystemExit("persisted SSH command is not canonical")
              raw = fields[fields.index("-i") + 1]
              prefix = "$RUNNER_TEMP/"
              if not raw.startswith(prefix):
                  raise SystemExit("persisted SSH key is outside RUNNER_TEMP")
              name = raw.removeprefix(prefix)
              if re.fullmatch(r"[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}", name) is None:
                  raise SystemExit("persisted SSH key name is invalid")
              expected.add(runner_temp / name)
          actual = set()
          for path in runner_temp.iterdir():
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode):
                  continue
              with path.open("rb") as stream:
                  header = stream.read(256)
              if re.search(br"^-----BEGIN (?:[A-Z0-9 ]+ )?PRIVATE KEY-----$", header, re.MULTILINE):
                  actual.add(path)
          if len(expected) != 2 or actual != expected:
              raise SystemExit("audit SSH key was not synchronously removed")
          PY
          rm -rf audit
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --max-filesize 16777216 \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/age.tar.gz"
          printf '%s  %s\n' \
            bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377 \
            "$RUNNER_TEMP/age.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/age.tar.gz" \
            --directory "$RUNNER_TEMP"
          install -m 0555 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age-bin"
          rm -rf "$RUNNER_TEMP/age" "$RUNNER_TEMP/age.tar.gz"
          release_commit=$(git rev-parse HEAD)
          authority_tail_blob=$(git rev-parse \
            HEAD:scripts/release_authority_tail.sh)
          plan_sha256=$(sha256sum "$RUNNER_TEMP/release-plan.json" | awk '{print $1}')
          started_event_sha256=$(sha256sum \
            "$RUNNER_TEMP/release-started-event.json" | awk '{print $1}')
          archive_sidecar_sha256=$(sha256sum \
            "$RUNNER_TEMP/archive-sidecar.json" | awk '{print $1}')
          archive_ciphertext_sha256=$(sha256sum \
            "$RUNNER_TEMP/archive.tar.age" | awk '{print $1}')
          age_binary_sha256=$(sha256sum "$RUNNER_TEMP/age-bin" | awk '{print $1}')
          test ! -e "$RUNNER_TEMP/pre-authority-stage.json"
          jq -n \
            --arg mode production \
            --arg release_commit "$release_commit" \
            --arg state_commit "$STATE_COMMIT" \
            --arg authority_tail_blob "$authority_tail_blob" \
            --arg plan_sha256 "$plan_sha256" \
            --arg started_event_sha256 "$started_event_sha256" \
            --arg archive_sidecar_sha256 "$archive_sidecar_sha256" \
            --arg archive_ciphertext_sha256 "$archive_ciphertext_sha256" \
            --arg age_binary_sha256 "$age_binary_sha256" \
            '{schema_version: 1, mode: $mode,
              release_commit: $release_commit, state_commit: $state_commit,
              authority_tail_blob: $authority_tail_blob,
              plan_sha256: $plan_sha256,
              started_event_sha256: $started_event_sha256,
              archive_sidecar_sha256: $archive_sidecar_sha256,
              archive_ciphertext_sha256: $archive_ciphertext_sha256,
              age_binary_sha256: $age_binary_sha256}' \
            > "$RUNNER_TEMP/pre-authority-stage.json"

      - name: Require the exact production release Invoke role
        env:
          CONFIGURED_ROLE_ARN: ${{ vars.AWS_RELEASE_UNWRAP_ROLE_ARN }}
        run: |
          set -euo pipefail
          test "$CONFIGURED_ROLE_ARN" = \
            arn:aws:iam::161072922960:role/lean-eval-release-unwrap-invoker-production

      - name: Assume the production Invoke-only release role
        id: aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_UNWRAP_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: lean-eval-release-controller
          retry-max-attempts: 4
          allowed-account-ids: 161072922960
          output-credentials: false
          output-env-credentials: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"lambda:InvokeFunction","Resource":"arn:aws:lambda:us-east-1:161072922960:function:lean-eval-archive-unwrap-production:live"},{"Effect":"Allow","Action":"sts:GetCallerIdentity","Resource":"*"}]}
          mask-aws-account-id: true

      # This is the only repository-authored step after role assumption. Its
      # inline provider phase executes no checkout; execve then replaces the
      # secret-bearing shell with a closed environment before checkout code.
      - name: Invoke once and exec the sanitized release tail
        if: always()
        env:
          AWS_STEP_OUTCOME: ${{ steps.aws.outcome }}
        run: |
          # shellcheck disable=SC2154  # Assigned inside this first-command EXIT trap.
          trap 'status=$?
          trap - EXIT
          set +e
          if [ -n "${RUNNER_TEMP:-}" ] && [ -d "$RUNNER_TEMP" ]; then
            /usr/bin/rm -rf "$RUNNER_TEMP/reconstructed" "$RUNNER_TEMP/state-views"
            /usr/bin/rm -f "$RUNNER_TEMP"/release-*.json "$RUNNER_TEMP"/unwrap-*.json \
              "$RUNNER_TEMP"/identity.age "$RUNNER_TEMP"/source.tar.gz \
              "$RUNNER_TEMP"/archive.tar.age \
              "$RUNNER_TEMP"/archive-sidecar.json "$RUNNER_TEMP"/age-bin \
              "$RUNNER_TEMP"/pre-authority-stage.json
          fi
          exit "$status"' EXIT
          set -euo pipefail
          python_bin=$(readlink --canonicalize-existing "$(command -v python)")
          case "$python_bin" in /*) ;; *) exit 1 ;; esac
          [ -x "$python_bin" ]
          provider_status=1
          if [ "$AWS_STEP_OUTCOME" = success ]; then
            set +e
            "$python_bin" -I - \
              "$RUNNER_TEMP/release-plan.json" \
              "$RUNNER_TEMP/archive-sidecar.json" \
              "$RUNNER_TEMP/archive.tar.age" \
              "$RUNNER_TEMP/unwrap-request.json" <<'PY'
          """Source mirror for the literal, authority-bearing workflow provider phase.

          The workflows embed this file byte-for-byte and execute only the embedded copy
          with ``python -I -``. They never execute the checked-out mirror while AWS or
          OIDC authority exists. Tests enforce that both embedded copies remain exact.
          """

          from __future__ import annotations

          import base64
          import calendar
          import datetime as dt
          import hashlib
          import json
          import math
          import os
          import pathlib
          import re
          import stat
          import sys
          from collections.abc import Mapping
          from typing import Any

          UUID7 = re.compile(
              r"[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}"
          )
          RESULT_ID = re.compile(r"r2_[0-9a-f]{64}")
          LOGIN = re.compile(r"[a-z\d](?:[a-z\d-]{0,37}[a-z\d])?")
          PROBLEM = re.compile(r"[A-Za-z0-9][A-Za-z0-9_-]{0,127}")
          REPOSITORY = re.compile(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+")
          COMMIT = re.compile(r"[0-9a-f]{40}")
          DIGEST = re.compile(r"[0-9a-f]{64}")
          BASE64 = re.compile(r"[A-Za-z0-9+/]+={0,2}")
          AGE_RECIPIENT = re.compile(r"age1[0-9a-z]{40,4090}")
          ADAPTER = re.compile(r"[a-z][a-z0-9-]{0,63}-v[1-9][0-9]*")
          MAX_SAFE_INTEGER = 9_007_199_254_740_991
          MAX_WRAPPED_BYTES = 16_384
          MAX_SCAN_FILES = 1024
          MAX_SCAN_FILE_BYTES = 8 * 1024 * 1024
          MAX_SCAN_TOTAL_BYTES = 32 * 1024 * 1024
          STATE_RELEASE_CONTRACT_COMMIT = "a53c658a2de2188675134dc2890285fbaa17cf5a"

          CONTROLLER_QUALIFICATION_FIELDS = {
              "schema_version",
              "environment",
              "mode",
              "release_repository",
              "release_commit",
              "state_repository",
              "state_commit",
              "state_contract_commit",
              "state_source_event_count",
              "state_source_digest",
              "release_queue_sha256",
              "acceptance_snapshot_sha256",
          }
          METADATA_FIELDS = {
              "credit_identity",
              "component_models",
              "harness",
              "human_involvement",
              "web_access",
              "wall_time_seconds",
              "input_tokens",
              "output_tokens",
              "cost_usd",
              "billing_mode",
              "prompt",
              "notes",
          }

          SIDECAR_REQUIRED_FIELDS = {
              "schema_version",
              "submission_id",
              "submission_repo",
              "submission_ref",
              "submission_kind",
              "submission_public",
              "submitter",
              "model",
              "size_bytes_plaintext_tar",
              "sha256_plaintext_tar",
              "key_envelope",
              "sha256_ciphertext",
              "size_bytes_ciphertext",
              "archived_at",
              "benchmark_commit",
              "archiver_workflow_run",
          }
          SIDECAR_OPTIONAL_FIELDS = {
              "production_description",
              "solution_publication_status",
              "solution_publication_date",
              "problem_ids",
              "evaluator_verdict",
          }
          ENVELOPE_FIELDS = {
              "schema_version",
              "submission_id",
              "archive_ciphertext_sha256",
              "data_key_id",
              "age_recipient",
              "adapter",
              "wrapped_identity",
          }
          AUTHORITY_NAMES = (
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_SESSION_TOKEN",
              "ACTIONS_ID_TOKEN_REQUEST_TOKEN",
              "ACTIONS_ID_TOKEN_REQUEST_URL",
          )


          class ProviderError(ValueError):
              """Literal provider input or runner authority state is invalid."""


          def _object(value: Any, label: str) -> dict[str, Any]:
              if not isinstance(value, dict) or not all(
                  isinstance(key, str) for key in value
              ):
                  raise ProviderError(f"{label} must be an object")
              return value


          def _fields(value: dict[str, Any], expected: set[str], label: str) -> None:
              if set(value) != expected:
                  raise ProviderError(
                      f"{label} fields are not canonical; "
                      f"missing={sorted(expected - set(value))}, "
                      f"extra={sorted(set(value) - expected)}"
                  )


          def _match(pattern: re.Pattern[str], value: Any, label: str) -> str:
              if not isinstance(value, str) or pattern.fullmatch(value) is None:
                  raise ProviderError(f"{label} is invalid")
              return value


          def _bounded_integer(value: Any, label: str) -> int:
              if type(value) is not int or not 0 <= value <= MAX_SAFE_INTEGER:
                  raise ProviderError(f"{label} must be a nonnegative safe integer")
              return value


          def _safe_integer(value: Any, label: str, minimum: int) -> int:
              if (
                  isinstance(value, bool)
                  or not isinstance(value, int)
                  or not minimum <= value <= MAX_SAFE_INTEGER
              ):
                  raise ProviderError(f"{label} must be a safe integer >= {minimum}")
              return value


          def _parse_utc_milliseconds(value: Any, label: str) -> dt.datetime:
              if not isinstance(value, str):
                  raise ProviderError(f"{label} must be a timestamp string")
              try:
                  parsed = dt.datetime.strptime(value, "%Y-%m-%dT%H:%M:%S.%fZ").replace(
                      tzinfo=dt.UTC
                  )
              except ValueError as error:
                  raise ProviderError(f"{label} must be canonical UTC milliseconds") from error
              if parsed.strftime("%Y-%m-%dT%H:%M:%S.%fZ")[:-4] + "Z" != value:
                  raise ProviderError(f"{label} must be canonical UTC milliseconds")
              return parsed


          def _eligible_at(value: Any, label: str) -> str:
              accepted = _parse_utc_milliseconds(value, label)
              month_index = accepted.year * 12 + accepted.month + 1
              year, zero_based_month = divmod(month_index, 12)
              month = zero_based_month + 1
              day = min(accepted.day, calendar.monthrange(year, month)[1])
              eligible = accepted.replace(year=year, month=month, day=day)
              return eligible.strftime("%Y-%m-%dT%H:%M:%S.%fZ")[:-4] + "Z"


          def _metadata_text(value: Any, label: str, maximum: int) -> None:
              if (
                  not isinstance(value, str)
                  or not value
                  or len(value) > maximum
                  or any(ord(character) <= 0x1F or ord(character) == 0x7F for character in value)
              ):
                  raise ProviderError(
                      f"{label} must be non-empty control-free text of at most "
                      f"{maximum} code points"
                  )


          def _production_metadata(value: Any, label: str) -> dict[str, Any]:
              metadata = _object(value, label)
              if not set(metadata) <= METADATA_FIELDS:
                  raise ProviderError(f"{label} has unknown fields")
              text_limits = {
                  "credit_identity": 256,
                  "harness": 1024,
                  "human_involvement": 1024,
                  "prompt": 8192,
                  "notes": 4096,
              }
              for key, item in metadata.items():
                  item_label = f"{label}.{key}"
                  if key in text_limits:
                      _metadata_text(item, item_label, text_limits[key])
                  elif key == "component_models":
                      if not isinstance(item, list) or len(item) > 16:
                          raise ProviderError(f"{item_label} must have at most 16 entries")
                      for index, component in enumerate(item):
                          _metadata_text(component, f"{item_label}[{index}]", 256)
                  elif key == "web_access":
                      if not isinstance(item, bool):
                          raise ProviderError(f"{item_label} must be boolean")
                  elif key in {"wall_time_seconds", "cost_usd"}:
                      maximum = 31_536_000 if key == "wall_time_seconds" else 1_000_000
                      if (
                          isinstance(item, bool)
                          or not isinstance(item, (int, float))
                          or not math.isfinite(item)
                          or not 0 <= item <= maximum
                      ):
                          raise ProviderError(f"{item_label} must be finite and in range")
                  elif key in {"input_tokens", "output_tokens"}:
                      _safe_integer(item, item_label, 0)
                  elif key == "billing_mode" and item not in {
                      "api",
                      "subscription",
                      "unknown",
                  }:
                      raise ProviderError(f"{item_label} is invalid")
              return metadata


          def _result_id(login: str, model: str, problem_id: str, revision: int) -> str:
              canonical = json.dumps(
                  [login.lower(), model, problem_id, revision],
                  ensure_ascii=False,
                  separators=(",", ":"),
              ).encode("utf-8")
              return "r2_" + hashlib.sha256(b"lean-eval-result-v2\0" + canonical).hexdigest()


          def _validate_controller_binding(value: Any) -> dict[str, Any]:
              qualification = _object(value, "controller qualification")
              _fields(
                  qualification,
                  CONTROLLER_QUALIFICATION_FIELDS,
                  "controller qualification",
              )
              if (
                  qualification["schema_version"] != 1
                  or isinstance(qualification["schema_version"], bool)
                  or qualification["environment"] != "production"
                  or qualification["mode"] != "publication"
                  or qualification["release_repository"]
                  != "leanprover/lean-eval-releases"
                  or qualification["state_repository"] != "leanprover/lean-eval-state"
                  or qualification["state_contract_commit"]
                  != STATE_RELEASE_CONTRACT_COMMIT
              ):
                  raise ProviderError("controller qualification identity is invalid")
              for field in ("release_commit", "state_commit"):
                  _match(COMMIT, qualification[field], f"controller qualification.{field}")
              for field in (
                  "state_source_digest",
                  "release_queue_sha256",
                  "acceptance_snapshot_sha256",
              ):
                  _match(DIGEST, qualification[field], f"controller qualification.{field}")
              _safe_integer(
                  qualification["state_source_event_count"],
                  "controller qualification.state_source_event_count",
                  1,
              )
              return qualification


          def validate_execution_plan(value: Any) -> dict[str, Any]:
              """Mirror the complete plan validator used by ``prepare_unwrap``."""
              plan = _object(value, "release plan")
              _fields(
                  plan,
                  {"schema_version", "kind", "started_transition", "request"},
                  "release plan",
              )
              if plan["schema_version"] != 1 or isinstance(plan["schema_version"], bool):
                  raise ProviderError("release plan schema_version must be integer 1")
              if plan["kind"] != "execution":
                  raise ProviderError("release plan must contain one execution")

              started = _object(plan["started_transition"], "started_transition")
              _fields(
                  started,
                  {"event_type", "subject_id", "causation_event_id", "payload"},
                  "started_transition",
              )
              if started["event_type"] != "release.started":
                  raise ProviderError("started transition must be release.started")
              subject = _match(
                  RESULT_ID, started["subject_id"], "started_transition.subject_id"
              )
              _match(
                  UUID7,
                  started["causation_event_id"],
                  "started_transition.causation_event_id",
              )
              started_payload = _object(started["payload"], "started_transition.payload")
              _fields(started_payload, {"attempt"}, "started_transition.payload")
              _safe_integer(started_payload["attempt"], "started_transition.payload.attempt", 1)

              request = _object(plan["request"], "request")
              request_fields = {"schema_version", "result", "submission", "archive", "release"}
              if "controller" in request:
                  request_fields.add("controller")
              _fields(request, request_fields, "request")
              if request["schema_version"] != 1 or isinstance(
                  request["schema_version"], bool
              ):
                  raise ProviderError("request schema_version must be integer 1")
              if "controller" in request:
                  _validate_controller_binding(request["controller"])

              result = _object(request["result"], "request.result")
              _fields(
                  result,
                  {"result_id", "problem_id", "statement_revision", "commit", "tree_digest"},
                  "request.result",
              )
              identity = _match(RESULT_ID, result["result_id"], "request.result.result_id")
              problem = _match(PROBLEM, result["problem_id"], "request.result.problem_id")
              revision = _safe_integer(
                  result["statement_revision"], "request.result.statement_revision", 1
              )
              _match(COMMIT, result["commit"], "request.result.commit")
              _match(DIGEST, result["tree_digest"], "request.result.tree_digest")
              if identity != subject:
                  raise ProviderError("started transition subject differs from result_id")

              submission = _object(request["submission"], "request.submission")
              _fields(
                  submission,
                  {"submission_id", "owner_login", "declared_model", "production_metadata"},
                  "request.submission",
              )
              submission_id = _match(
                  UUID7,
                  submission["submission_id"],
                  "request.submission.submission_id",
              )
              login = _match(LOGIN, submission["owner_login"], "request.submission.owner_login")
              model = submission["declared_model"]
              if (
                  not isinstance(model, str)
                  or not model
                  or len(model.encode("utf-8")) > 256
                  or any(ord(character) <= 0x1F or ord(character) == 0x7F for character in model)
              ):
                  raise ProviderError("request.submission.declared_model is invalid")
              if identity != _result_id(login, model, problem, revision):
                  raise ProviderError("request result_id does not match its deterministic identity")
              _production_metadata(
                  submission["production_metadata"],
                  "request.submission.production_metadata",
              )

              archive = _object(request["archive"], "request.archive")
              _fields(
                  archive,
                  {
                      "archive_repository",
                      "archive_commit",
                      "archive_path",
                      "archive_ciphertext_sha256",
                      "encrypted",
                  },
                  "request.archive",
              )
              _match(
                  REPOSITORY,
                  archive["archive_repository"],
                  "request.archive.archive_repository",
              )
              _match(COMMIT, archive["archive_commit"], "request.archive.archive_commit")
              _match(
                  DIGEST,
                  archive["archive_ciphertext_sha256"],
                  "request.archive.archive_ciphertext_sha256",
              )
              canonical_archive = (
                  f"archives/{submission_id.replace('-', '')[:2]}/{submission_id}.tar.age"
              )
              if archive["archive_path"] != canonical_archive:
                  raise ProviderError("request archive_path does not match submission_id")
              if archive["encrypted"] is not True:
                  raise ProviderError("request archive must be encrypted")

              release = _object(request["release"], "request.release")
              _fields(
                  release,
                  {"accepted_at", "eligible_at", "path", "license"},
                  "request.release",
              )
              accepted = release["accepted_at"]
              eligible = release["eligible_at"]
              _parse_utc_milliseconds(accepted, "request.release.accepted_at")
              eligible_instant = _parse_utc_milliseconds(
                  eligible, "request.release.eligible_at"
              )
              if eligible != _eligible_at(accepted, "request.release.accepted_at"):
                  raise ProviderError("request release eligibility is not two UTC calendar months")
              canonical_release = (
                  f"releases/{eligible_instant.year:04d}/{eligible_instant.month:02d}/{identity}"
              )
              if release["path"] != canonical_release:
                  raise ProviderError("request release path is not canonical")
              if release["license"] != "Apache-2.0":
                  raise ProviderError("request release license must be Apache-2.0")
              return plan


          def _canonical_base64(value: Any, label: str, maximum: int) -> bytes:
              raw = _match(BASE64, value, label)
              if len(raw) % 4 != 0:
                  raise ProviderError(f"{label} is not canonical base64")
              try:
                  decoded = base64.b64decode(raw, validate=True)
              except ValueError as error:
                  raise ProviderError(f"{label} is not valid base64") from error
              if (
                  not decoded
                  or len(decoded) > maximum
                  or base64.b64encode(decoded).decode("ascii") != raw
              ):
                  raise ProviderError(
                      f"{label} is empty, noncanonical, or exceeds its size limit"
                  )
              return decoded


          def archive_key_id(submission_id: str, recipient: str) -> str:
              _match(UUID7, submission_id, "submission_id")
              _match(AGE_RECIPIENT, recipient, "age_recipient")
              value = f"{submission_id}\0{recipient}".encode("ascii")
              return "ak1_" + hashlib.sha256(
                  b"lean-eval-archive-key-v1\0" + value
              ).hexdigest()


          def validate_sidecar(value: Any, ciphertext: bytes) -> dict[str, Any]:
              sidecar = _object(value, "archive sidecar")
              missing = SIDECAR_REQUIRED_FIELDS - set(sidecar)
              extra = set(sidecar) - SIDECAR_REQUIRED_FIELDS - SIDECAR_OPTIONAL_FIELDS
              if missing or extra:
                  raise ProviderError(
                      "archive sidecar fields are not canonical; "
                      f"missing={sorted(missing)}, extra={sorted(extra)}"
                  )
              if type(sidecar["schema_version"]) is not int or sidecar["schema_version"] != 3:
                  raise ProviderError("archive sidecar schema_version must be integer 3")
              _match(UUID7, sidecar["submission_id"], "sidecar submission_id")
              _match(REPOSITORY, sidecar["submission_repo"], "sidecar submission_repo")
              _match(COMMIT, sidecar["submission_ref"], "sidecar submission_ref")
              if sidecar["submission_kind"] not in {"github_repo", "gist"}:
                  raise ProviderError("sidecar submission_kind is invalid")
              if type(sidecar["submission_public"]) is not bool:
                  raise ProviderError("sidecar submission_public must be boolean")
              for field in ("submitter", "model"):
                  field_value = sidecar[field]
                  if (
                      not isinstance(field_value, str)
                      or not field_value.strip()
                      or len(field_value.encode("utf-8")) > 256
                  ):
                      raise ProviderError(f"sidecar {field} is invalid")
              _bounded_integer(sidecar["size_bytes_plaintext_tar"], "sidecar plaintext size")
              _match(DIGEST, sidecar["sha256_plaintext_tar"], "sidecar plaintext digest")
              ciphertext_size = _bounded_integer(
                  sidecar["size_bytes_ciphertext"], "sidecar ciphertext size"
              )
              if ciphertext_size != len(ciphertext):
                  raise ProviderError(
                      "sidecar ciphertext size does not match the archive bytes"
                  )
              _match(DIGEST, sidecar["sha256_ciphertext"], "sidecar ciphertext digest")
              _match(COMMIT, sidecar["benchmark_commit"], "sidecar benchmark commit")
              archived_at = sidecar["archived_at"]
              if (
                  not isinstance(archived_at, str)
                  or re.fullmatch(
                      r"(?!0000-)[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z",
                      archived_at,
                  )
                  is None
              ):
                  raise ProviderError("sidecar archived_at is not canonical UTC seconds")
              try:
                  parsed_archive_time = dt.datetime.fromisoformat(
                      archived_at[:-1] + "+00:00"
                  )
              except ValueError as error:
                  raise ProviderError("sidecar archived_at is not a real timestamp") from error
              if parsed_archive_time.strftime("%Y-%m-%dT%H:%M:%SZ") != archived_at:
                  raise ProviderError("sidecar archived_at is not a real timestamp")
              workflow_run = sidecar["archiver_workflow_run"]
              if (
                  not isinstance(workflow_run, str)
                  or re.fullmatch(
                      r"https://github\.com/leanprover/lean-eval-submissions/actions/runs/[1-9][0-9]*",
                      workflow_run,
                  )
                  is None
              ):
                  raise ProviderError("sidecar archiver_workflow_run is invalid")
              if "problem_ids" in sidecar:
                  problems = sidecar["problem_ids"]
                  if (
                      not isinstance(problems, list)
                      or not problems
                      or any(not isinstance(item, str) for item in problems)
                      or len(problems) != len(set(problems))
                      or problems != sorted(problems)
                      or any(PROBLEM.fullmatch(item) is None for item in problems)
                  ):
                      raise ProviderError(
                          "sidecar problem_ids is not a sorted unique problem list"
                      )
              if "evaluator_verdict" in sidecar and not isinstance(
                  sidecar["evaluator_verdict"], dict
              ):
                  raise ProviderError("sidecar evaluator_verdict must be an object")
              return sidecar


          def validate_envelope(value: Any) -> dict[str, Any]:
              envelope = _object(value, "key envelope")
              if set(envelope) != ENVELOPE_FIELDS:
                  raise ProviderError("key envelope fields are not canonical")
              if type(envelope["schema_version"]) is not int or envelope["schema_version"] != 1:
                  raise ProviderError("key envelope schema_version must be integer 1")
              submission_id = _match(
                  UUID7, envelope["submission_id"], "envelope submission_id"
              )
              _match(
                  DIGEST,
                  envelope["archive_ciphertext_sha256"],
                  "envelope archive digest",
              )
              recipient = _match(
                  AGE_RECIPIENT, envelope["age_recipient"], "envelope age recipient"
              )
              if envelope["data_key_id"] != archive_key_id(submission_id, recipient):
                  raise ProviderError(
                      "envelope data_key_id does not match submission and recipient"
                  )
              _match(ADAPTER, envelope["adapter"], "envelope adapter")
              wrapped = envelope["wrapped_identity"]
              if not isinstance(wrapped, str) or len(wrapped) > MAX_WRAPPED_BYTES:
                  raise ProviderError("envelope wrapped_identity exceeds its encoded size limit")
              _canonical_base64(wrapped, "envelope wrapped_identity", MAX_WRAPPED_BYTES)
              return envelope


          def _iter_scan_files(root: pathlib.Path) -> list[pathlib.Path]:
              if not root.exists():
                  return []
              if root.is_symlink() or not root.is_dir():
                  raise ProviderError(f"authority scan root is unsafe: {root}")
              files: list[pathlib.Path] = []
              total = 0
              for directory, names, filenames in os.walk(root, followlinks=False):
                  directory_path = pathlib.Path(directory)
                  for name in names:
                      child = directory_path / name
                      if child.is_symlink():
                          raise ProviderError(f"authority scan directory is a symlink: {child}")
                  for name in filenames:
                      child = directory_path / name
                      metadata = child.lstat()
                      if not stat.S_ISREG(metadata.st_mode):
                          raise ProviderError(f"authority scan file is not regular: {child}")
                      if metadata.st_size > MAX_SCAN_FILE_BYTES:
                          raise ProviderError(f"authority scan file is too large: {child}")
                      total += metadata.st_size
                      files.append(child)
                      if len(files) > MAX_SCAN_FILES or total > MAX_SCAN_TOTAL_BYTES:
                          raise ProviderError("authority scan exceeds its aggregate limit")
              return files


          def scan_authority_files(environ: Mapping[str, str]) -> None:
              runner_temp = pathlib.Path(environ["RUNNER_TEMP"])
              home = pathlib.Path(environ["HOME"])
              needles = [name.encode("ascii") for name in AUTHORITY_NAMES]
              needles.extend(
                  name.encode("ascii")
                  for name in ("aws_access_key_id", "aws_secret_access_key", "aws_session_token")
              )
              for name in AUTHORITY_NAMES:
                  value = environ.get(name, "")
                  if value:
                      needles.append(value.encode("utf-8"))
              for root in (runner_temp / "_runner_file_commands", home / ".aws"):
                  for path in _iter_scan_files(root):
                      content = path.read_bytes()
                      if any(needle in content for needle in needles):
                          raise ProviderError(f"authority remains in runner file: {path}")


          def build_request(
              plan_value: Any,
              sidecar_value: Any,
              ciphertext: bytes,
              trusted_now: dt.datetime,
              *,
              random_bytes: bytes | None = None,
              runner_nonce: str | None = None,
          ) -> dict[str, Any]:
              plan = validate_execution_plan(plan_value)
              request = plan["request"]
              archive = request["archive"]
              submission = request["submission"]
              submission_id = submission["submission_id"]
              archive_path = archive["archive_path"]
              archive_digest = archive["archive_ciphertext_sha256"]
              sidecar = validate_sidecar(sidecar_value, ciphertext)
              envelope = validate_envelope(sidecar.get("key_envelope"))
              actual_digest = hashlib.sha256(ciphertext).hexdigest()
              if sidecar["submission_id"] != submission_id:
                  raise ProviderError("sidecar submission_id does not match the release plan")
              if envelope["submission_id"] != submission_id:
                  raise ProviderError("envelope submission_id does not match the release plan")
              if sidecar["sha256_ciphertext"] != archive_digest:
                  raise ProviderError("sidecar ciphertext digest does not match the release plan")
              if envelope["archive_ciphertext_sha256"] != archive_digest:
                  raise ProviderError("envelope ciphertext digest does not match the release plan")
              if actual_digest != archive_digest:
                  raise ProviderError("ciphertext bytes digest does not match the release plan")
              if trusted_now.tzinfo is None or trusted_now.utcoffset() != dt.timedelta(0):
                  raise ProviderError("trusted time must be timezone-aware UTC")
              randomness = os.urandom(10) if random_bytes is None else random_bytes
              if not isinstance(randomness, bytes) or len(randomness) != 10:
                  raise ProviderError("UUIDv7 randomness must contain exactly ten bytes")
              milliseconds = int(trusted_now.timestamp() * 1000)
              if not 0 <= milliseconds <= 0xFFFFFFFFFFFF:
                  raise ProviderError("UUIDv7 time is outside its 48-bit range")
              raw = bytearray(milliseconds.to_bytes(6, "big") + randomness)
              raw[6] = 0x70 | (raw[6] & 0x0F)
              raw[8] = 0x80 | (raw[8] & 0x3F)
              encoded = raw.hex()
              request_id = (
                  f"{encoded[:8]}-{encoded[8:12]}-{encoded[12:16]}-"
                  f"{encoded[16:20]}-{encoded[20:]}"
              )
              nonce = os.urandom(32).hex() if runner_nonce is None else runner_nonce
              _match(DIGEST, nonce, "runner nonce")
              issued_at = trusted_now.isoformat(timespec="milliseconds").replace("+00:00", "Z")
              expires_at = (trusted_now + dt.timedelta(minutes=5)).isoformat(
                  timespec="milliseconds"
              ).replace("+00:00", "Z")
              capability = {
                  "schema_version": 1,
                  "purpose": "lean-eval-release",
                  "request_id": request_id,
                  "submission_id": submission_id,
                  "archive_repository": archive["archive_repository"],
                  "archive_commit": archive["archive_commit"],
                  "archive_path": archive_path,
                  "archive_ciphertext_sha256": archive_digest,
                  "data_key_id": envelope["data_key_id"],
                  "runner_nonce": nonce,
                  "issued_at": issued_at,
                  "expires_at": expires_at,
                  "max_uses": 1,
              }
              return {
                  "schema_version": 1,
                  "operation": "unwrap",
                  "adapter": envelope["adapter"],
                  "envelope": envelope,
                  "capability": capability,
                  "expected_purpose": "lean-eval-release",
                  "expected_runner_nonce": nonce,
              }


          def main(argv: list[str] | None = None) -> int:
              arguments = sys.argv[1:] if argv is None else argv
              if len(arguments) != 4:
                  raise ProviderError("literal provider requires four paths")
              plan_path, sidecar_path, ciphertext_path, output_path = map(
                  pathlib.Path, arguments
              )
              scan_authority_files(os.environ)
              plan = json.loads(plan_path.read_text(encoding="utf-8"))
              sidecar = json.loads(sidecar_path.read_text(encoding="utf-8"))
              ciphertext = ciphertext_path.read_bytes()
              value = build_request(
                  plan,
                  sidecar,
                  ciphertext,
                  dt.datetime.now(dt.timezone.utc),
              )
              output_path.write_text(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      allow_nan=False,
                      separators=(",", ":"),
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )
              os.chmod(output_path, 0o600)
              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except (KeyError, OSError, ProviderError, UnicodeError, ValueError) as error:
                  print(f"literal provider failed closed: {error}", file=sys.stderr)
                  raise SystemExit(1) from error
          PY
            provider_status=$?
            if [ "$provider_status" -eq 0 ]; then
              aws lambda invoke \
                --function-name lean-eval-archive-unwrap-production \
                --qualifier live \
                --cli-binary-format raw-in-base64-out \
                --payload "fileb://$RUNNER_TEMP/unwrap-request.json" \
                "$RUNNER_TEMP/unwrap-response.json" \
                > "$RUNNER_TEMP/unwrap-metadata.json"
              provider_status=$?
            fi
            set -e
          fi
          if [ "$provider_status" -ne 0 ]; then
            exit 1
          fi
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          coproc RELEASE_CLEANUP_WATCHDOG {
            exec -c /usr/bin/bash --noprofile --norc -c '
              set +e
              printf "%s\n" lean-eval-release-cleanup-watchdog-ready-v1
              while IFS= read -r _; do :; done
              runner_temp=$1
              if [ -n "$runner_temp" ] && [ -d "$runner_temp" ]; then
                /usr/bin/rm -rf "$runner_temp/reconstructed" \
                  "$runner_temp/state-views"
                /usr/bin/rm -f "$runner_temp"/release-*.json \
                  "$runner_temp"/unwrap-*.json "$runner_temp"/identity.age \
                  "$runner_temp"/source.tar.gz "$runner_temp"/archive.tar.age \
                  "$runner_temp"/archive-sidecar.json "$runner_temp"/age-bin \
                  "$runner_temp"/pre-authority-stage.json
              fi
            ' lean-eval-release-cleanup-watchdog-v1 "$RUNNER_TEMP"
          }
          watchdog_read=${RELEASE_CLEANUP_WATCHDOG[0]}
          watchdog_write=${RELEASE_CLEANUP_WATCHDOG[1]}
          IFS= read -r watchdog_ready <&"$watchdog_read"
          test "$watchdog_ready" = lean-eval-release-cleanup-watchdog-ready-v1
          exec 9>"/proc/self/fd/$watchdog_write"
          exec {watchdog_read}<&-
          exec {watchdog_write}>&-
          unset RELEASE_CLEANUP_WATCHDOG RELEASE_CLEANUP_WATCHDOG_PID
          unset watchdog_read watchdog_write watchdog_ready
          exec -c /usr/bin/bash --noprofile --norc -s -- \
            production "$HOME" "$python_bin" "$RUNNER_TEMP" \
            "$GITHUB_STEP_SUMMARY" '' <<'SANITIZED'
          #!/usr/bin/env bash

          # Review mirror for the empty-environment literal in both release workflows.
          # The workflows execute their embedded copies, never this checked-out file.

          # shellcheck disable=SC2154  # Assigned inside this first-command EXIT trap.
          trap 'status=$?
          trap - EXIT
          set +e
          if [ -n "${RUNNER_TEMP:-}" ] && [ -d "$RUNNER_TEMP" ]; then
            /usr/bin/rm -rf "$RUNNER_TEMP/reconstructed" "$RUNNER_TEMP/state-views"
            /usr/bin/rm -f "$RUNNER_TEMP"/release-*.json "$RUNNER_TEMP"/unwrap-*.json \
              "$RUNNER_TEMP"/identity.age "$RUNNER_TEMP"/source.tar.gz \
              "$RUNNER_TEMP"/archive.tar.age "$RUNNER_TEMP"/archive-sidecar.json \
              "$RUNNER_TEMP"/age-bin "$RUNNER_TEMP"/pre-authority-stage.json
          fi
          exit "$status"' EXIT
          set -euo pipefail

          mode=${1:-}
          case "$mode" in
            probe|production|staging) ;;
            *) echo "literal release sanitizer mode is invalid" >&2; exit 2 ;;
          esac

          if [ "$mode" = probe ]; then
            HOME=${HOME:-}
            PATH=${PATH:-}
            RUNNER_TEMP=${RUNNER_TEMP:-}
          else
            [ "$#" -eq 6 ]
            HOME=$2
            PYTHON_BIN=$3
            RUNNER_TEMP=$4
            GITHUB_STEP_SUMMARY=$5
            SUBMISSION_ID=$6
            PATH=/usr/local/bin:/usr/bin:/bin
          fi
          export HOME PATH

          authority_names=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_SESSION_TOKEN
            ACTIONS_ID_TOKEN_REQUEST_TOKEN
            ACTIONS_ID_TOKEN_REQUEST_URL
          )

          : "${HOME:?}"
          : "${PATH:?}"
          : "${RUNNER_TEMP:?}"
          case "$HOME:$RUNNER_TEMP" in
            /*:/*) ;;
            *) echo "literal release sanitizer received a relative path" >&2; exit 1 ;;
          esac
          [ -d "$HOME" ] && [ ! -L "$HOME" ]
          [ -d "$RUNNER_TEMP" ] && [ ! -L "$RUNNER_TEMP" ]

          for name in "${authority_names[@]}"; do
            if [[ -v "$name" ]]; then
              echo "authority variable survived literal sanitized exec: $name" >&2
              exit 1
            fi
          done

          for proc in "/proc/$$/environ" "/proc/$PPID/environ"; do
            if [ ! -r "$proc" ]; then
              echo "cannot prove literal sanitized process environment: $proc" >&2
              exit 1
            fi
            while IFS= read -r -d '' entry; do
              for name in "${authority_names[@]}"; do
                case "$entry" in
                  "$name="*)
                    echo "authority remains process-readable in $proc: $name" >&2
                    exit 1
                    ;;
                esac
              done
            done < "$proc"
          done

          count=0
          total=0
          for root in "$RUNNER_TEMP/_runner_file_commands" "$HOME/.aws"; do
            [ ! -e "$root" ] || [ -d "$root" ] || {
              echo "authority scan root is unsafe: $root" >&2
              exit 1
            }
            [ ! -L "$root" ] || {
              echo "authority scan root is a symlink: $root" >&2
              exit 1
            }
            [ -d "$root" ] || continue
            unsafe=$(find -P "$root" -mindepth 1 \
              \( -type l -o \( ! -type d ! -type f \) \) -print -quit)
            if [ -n "$unsafe" ]; then
              echo "authority scan encountered an unsafe path: $unsafe" >&2
              exit 1
            fi
            while IFS= read -r -d '' path; do
              size=$(stat --format=%s -- "$path")
              count=$((count + 1))
              total=$((total + size))
              if [ "$count" -gt 1024 ] || [ "$size" -gt 8388608 ] || \
                [ "$total" -gt 33554432 ]; then
                echo "authority scan exceeded its size limit" >&2
                exit 1
              fi
              if LC_ALL=C grep --text --quiet --extended-regexp \
                'AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY|SESSION_TOKEN)|ACTIONS_ID_TOKEN_REQUEST_(TOKEN|URL)|aws_(access_key_id|secret_access_key|session_token)' \
                "$path"; then
                echo "authority name remains in runner file: $path" >&2
                exit 1
              fi
            done < <(find -P "$root" -type f -print0)
          done

          [ "$mode" != probe ] || exit 0

          : "${PYTHON_BIN:?}"
          : "${GITHUB_STEP_SUMMARY:?}"
          case "$PYTHON_BIN:$GITHUB_STEP_SUMMARY" in
            /*:/*) ;;
            *) echo "literal release sanitizer received a relative path" >&2; exit 1 ;;
          esac
          [ -x "$PYTHON_BIN" ] && [ ! -L "$PYTHON_BIN" ]

          proof="$RUNNER_TEMP/pre-authority-stage.json"
          [ -f "$proof" ] && [ ! -L "$proof" ]
          jq -e --arg mode "$mode" '
            type == "object" and
            (keys == [
              "age_binary_sha256",
              "archive_ciphertext_sha256",
              "archive_sidecar_sha256",
              "authority_tail_blob",
              "mode",
              "plan_sha256",
              "release_commit",
              "schema_version",
              "started_event_sha256",
              "state_commit"
            ]) and
            .schema_version == 1 and (.schema_version | type) == "number" and
            .mode == $mode and
            (.release_commit | test("^[0-9a-f]{40}$")) and
            (.authority_tail_blob | test("^[0-9a-f]{40}$")) and
            (.plan_sha256 | test("^[0-9a-f]{64}$")) and
            (.archive_sidecar_sha256 | test("^[0-9a-f]{64}$")) and
            (.archive_ciphertext_sha256 | test("^[0-9a-f]{64}$")) and
            (.age_binary_sha256 | test("^[0-9a-f]{64}$")) and
            (if $mode == "production" then
              (.state_commit | test("^[0-9a-f]{40}$")) and
              (.started_event_sha256 | test("^[0-9a-f]{64}$"))
            else
              .state_commit == "" and .started_event_sha256 == ""
            end)
          ' "$proof" >/dev/null

          check_digest() {
            local field=$1 path=$2 expected actual
            expected=$(jq -er --arg field "$field" '.[$field]' "$proof")
            actual=$(sha256sum -- "$path" | awk '{print $1}')
            test "$actual" = "$expected"
          }

          check_digest plan_sha256 "$RUNNER_TEMP/release-plan.json"
          check_digest archive_sidecar_sha256 "$RUNNER_TEMP/archive-sidecar.json"
          check_digest archive_ciphertext_sha256 "$RUNNER_TEMP/archive.tar.age"
          check_digest age_binary_sha256 "$RUNNER_TEMP/age-bin"
          if [ "$mode" = production ]; then
            check_digest started_event_sha256 "$RUNNER_TEMP/release-started-event.json"
          fi

          release_commit=$(jq -er .release_commit "$proof")
          tail_blob=$(jq -er .authority_tail_blob "$proof")
          test "$(git rev-parse HEAD)" = "$release_commit"
          test "$(git rev-parse HEAD:scripts/release_authority_tail.sh)" = "$tail_blob"
          test "$(git hash-object scripts/release_authority_tail.sh)" = "$tail_blob"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          if [ "$mode" = production ]; then
            state_commit=$(jq -er .state_commit "$proof")
            test "$(git -C state rev-parse HEAD)" = "$state_commit"
            test -z "$(git -C state status --porcelain --untracked-files=all)"
          fi

          test "$($PYTHON_BIN -I -c 'import sys; print(".".join(map(str, sys.version_info[:2])))')" = 3.11

          trap - EXIT
          exec env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            LITERAL_AUTHORITY_PROOF=release-authority-sanitized-v1 \
            PYTHON_BIN="$PYTHON_BIN" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            SUBMISSION_ID="${SUBMISSION_ID:-}" \
            bash --noprofile --norc scripts/release_authority_tail.sh "$mode"
          SANITIZED
