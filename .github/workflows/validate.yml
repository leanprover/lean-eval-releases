name: Validate release tooling

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout pinned to v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python pinned to v7.0.0.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'
      # actions/setup-go pinned to v7.0.0.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.12'
          cache: false
      - name: Install actionlint
        run: |
          # actionlint pinned to v1.7.12.
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Check the literal sanitizer and sanitized release authority tail
        run: |
          bash -n scripts/release_sanitizer_literal.sh
          bash -n scripts/release_authority_tail.sh
          shellcheck scripts/release_sanitizer_literal.sh
          shellcheck scripts/release_authority_tail.sh
      - name: Lint workflows
        # The authored shell mirrors above deliberately use the hosted
        # ShellCheck. Disable actionlint's ambient ShellCheck/Pyflakes
        # integrations; only actionlint itself is commit-pinned here.
        run: actionlint -shellcheck= -pyflakes=
      - name: Run release tooling tests
        run: python -m unittest discover -s tests -v

  pinned-state-integration:
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'leanprover/lean-eval-releases' &&
      github.ref == 'refs/heads/main'
    environment: release-production
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # PR jobs never receive this protected-environment key. On protected main,
      # the pinned action uses it only to fetch the exact immutable State commit
      # and removes it before any repository-owned test code runs.
      - name: Check out the exact production State consumer contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-state
          ref: 0c943edde8a247b8670e10339b80fc65be6c0f33
          path: .pinned-state-contract
          persist-credentials: false
          ssh-key: ${{ secrets.PRODUCTION_STATE_CONTROLLER_KEY }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'
      - name: Run the exact pinned State consumer integration
        env:
          LEAN_EVAL_PINNED_STATE_ROOT: ${{ github.workspace }}/.pinned-state-contract
        run: >-
          python -m unittest
          tests.test_release_removal_pinned_state.PinnedStateConsumerIntegrationTests
          -v

  publication-disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Publication remains gated; this job intentionally performs no release.'
