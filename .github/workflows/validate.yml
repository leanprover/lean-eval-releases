name: Validate release tooling

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout pinned to v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python pinned to v7.0.0.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'
      # actions/setup-go pinned to v7.0.0.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.12'
          cache: false
      - name: Install actionlint
        run: |
          # actionlint pinned to v1.7.12.
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Lint workflows
        # Disable ambient runner linters; actionlint itself is commit-pinned.
        run: actionlint -shellcheck= -pyflakes=
      - run: python -m unittest discover -s tests -v

  publication-disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Publication remains gated; this job intentionally performs no release.'
